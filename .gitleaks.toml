title = "Warpkeep secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "One non-secret UUID used only as a reducer idempotency fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^4a9977d2-c7c4-4d63-8e65-f28f966c0c33$''']
paths = ['''^tests/warpkeepConnection\.test\.ts$''']

[[allowlists]]
description = "One public canonical Inner Keep slot ID used in a stateful reducer fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^inner-keep-slot-m01$''']
paths = ['''^spacetimedb/tests/innerKeepProjectLifecycleStateful\.test\.ts$''']

[[allowlists]]
description = "One non-secret UUID used only as a Realm Chat client idempotency fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^018f7b44-5f2f-4c54-8c0d-3f521d46b193$''']
paths = ['''^tests/realmChatSendIdempotency\.test\.ts$''']

[[allowlists]]
description = "One non-secret UUID used only as a historical additive-migration Realm Chat request fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^018f7b44-5f2f-7c54-8c0d-3f521d46b194$''']
paths = ['''^spacetimedb/migration-fixtures/additive-v15-schema/src/index\.ts$''']

[[allowlists]]
description = "Public Farcaster custody address inside the signed domain-association header"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^0x7a9E6965FCF1ad2cfbff67f0C0aA102F0DEa23d4$''']
paths = ['''^(?:public|dist)/\.well-known/farcaster\.json$''']

[[allowlists]]
description = "Fixed owner-private launch directory label, never credential material"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^launch-secrets-v1$''']
paths = [
  '''^scripts/production-player-canary-deploy-authority\.d\.mts$''',
  '''^scripts/production-player-canary-deploy-authority\.mjs$''',
]

[[allowlists]]
description = "Fixed owner-private notification secret filename, never its contents"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^notification-operator-secret-v1\.txt$''']
paths = ['''^scripts/production-player-canary-deploy-authority\.mjs$''']

[[allowlists]]
description = "Non-secret operator test fixture material"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^notification-secret-material-00001$''']
paths = ['''^tests/productionPlayerCanaryOperator\.test\.ts$''']

[[allowlists]]
description = "Non-secret sealed-launch boolean schema key"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^g002AdmissionMutationsEnabled$''']
paths = ['''^scripts/verify-0\.4\.0-sealed-launch\.mjs$''']

[[allowlists]]
description = "Non-secret sealed-launch boolean schema key in the activation envelope"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^g002AdmissionMutationsEnabled$''']
paths = ['''^scripts/generate-0\.4\.0-sealed-launch-activation\.mjs$''']

[[allowlists]]
description = "Non-secret sealed-launch receipt digest schema key in a test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^g002PublishReceiptDigest$''']
paths = ['''^tests/sealedLaunchActivationGenerator\.test\.ts$''']
