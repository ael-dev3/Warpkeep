title = "Warpkeep secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "One non-secret UUID used only as a reducer idempotency fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^4a9977d2-c7c4-4d63-8e65-f28f966c0c33$''']
paths = ['''^tests/warpkeepConnection\.test\.ts$''']

[[allowlists]]
description = "One public canonical Inner Keep slot ID used in a stateful reducer fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^inner-keep-slot-m01$''']
paths = ['''^spacetimedb/tests/innerKeepProjectLifecycleStateful\.test\.ts$''']

[[allowlists]]
description = "One non-secret UUID used only as a Realm Chat client idempotency fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^018f7b44-5f2f-4c54-8c0d-3f521d46b193$''']
paths = ['''^tests/realmChatSendIdempotency\.test\.ts$''']

[[allowlists]]
description = "One non-secret UUID used only as a historical additive-migration Realm Chat request fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^018f7b44-5f2f-7c54-8c0d-3f521d46b194$''']
paths = ['''^spacetimedb/migration-fixtures/additive-v15-schema/src/index\.ts$''']

[[allowlists]]
description = "Public Farcaster custody address inside the signed domain-association header"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^0x7a9E6965FCF1ad2cfbff67f0C0aA102F0DEa23d4$''']
paths = ['''^(?:public|dist)/\.well-known/farcaster\.json$''']

[[allowlists]]
description = "Fixed owner-private launch directory label, never credential material"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^launch-secrets-v1$''']
paths = [
  '''^scripts/production-player-canary-deploy-authority\.d\.mts$''',
  '''^scripts/production-player-canary-deploy-authority\.mjs$''',
]

[[allowlists]]
description = "Fixed owner-private notification secret filename, never its contents"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^notification-operator-secret-v1\.txt$''']
paths = ['''^scripts/production-player-canary-deploy-authority\.mjs$''']

[[allowlists]]
description = "Non-secret operator test fixture material"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^notification-secret-material-00001$''']
paths = ['''^tests/productionPlayerCanaryOperator\.test\.ts$''']

[[allowlists]]
description = "Non-secret sealed-launch boolean schema key"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^g002AdmissionMutationsEnabled$''']
paths = ['''^scripts/verify-0\.4\.0-sealed-launch\.mjs$''']

[[allowlists]]
description = "Non-secret sealed-launch boolean schema key in the activation envelope"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^g002AdmissionMutationsEnabled$''']
paths = ['''^scripts/generate-0\.4\.0-sealed-launch-activation\.mjs$''']

[[allowlists]]
description = "Non-secret sealed-launch receipt digest schema key in a test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^g002PublishReceiptDigest$''']
paths = ['''^tests/sealedLaunchActivationGenerator\.test\.ts$''']

[[allowlists]]
description = "One non-secret UUID used only as a sealed-launch negative authority-field fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^123e4567-e89b-42d3-a456-426614174000$''']
paths = ['''^tests/sealedLaunchActivationGenerator\.test\.ts$''']

[[allowlists]]
description = "Non-secret sealed-launch boolean schema key in public activation artifact verification"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^g002AdmissionMutationsEnabled$''']
paths = ['''^scripts/verify-sealed-realms-public-activation-artifact\.mjs$''']

[[allowlists]]
description = "Two public toolchain key SHA-256 records in the audited recovery records, WSL preparation and fixture test"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^services/release-recovery/scripts/release-recovery-toolchain-records\.mjs$''','''^services/release-recovery/scripts/prepare-release-recovery-wsl-toolchain\.mjs$''','''^services/release-recovery/test/releaseRecoverySpacetimeFixtures\.test\.ts$''']
regexes = ['''^5115095e2f8010c75da052ecb1cfb3af630e084f0f8daa93a863557b01b0f90a$''','''^e31e1aa40a8331f01d753cef475f7b9eab934fc25f5f0b36995bfd80bd66ad27$''']

[[allowlists]]
description = "Fixed synthetic private-fid label in the recovery Realm evidence redaction test"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^services/release-recovery/test/realmEvidence\.test\.ts$''']
regexes = ['''^private-fid-123456$''']

[[allowlists]]
description = "Fixed sequential-byte RPC credential fixture in the bridge recovery configuration test"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^services/auth-bridge/test/releaseRecoveryConfig\.test\.ts$''']
regexes = ['''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8$''']

[[allowlists]]
description = "Fixed synthetic owner label inside the bridge observation URL-redaction test"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^services/auth-bridge/test/releaseRecoveryObservation\.test\.ts$''']
regexes = ['''^secret-owner-fid-12345$''']

[[allowlists]]
description = "Public sealed-launch boolean schema key in recovery evidence and activation record validation"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^services/release-recovery/src/githubEvidence\.ts$''','''^scripts/sealed-realms-production-activation-records\.mjs$''','''^scripts/recovery-binding-projection\.mjs$''','''^scripts/recovery-activation-candidate\.mjs$''','''^scripts/sealed-realms-production-activation-lane\.bundle\.mjs$''','''^scripts/sealed-realms-production-g001-lane\.bundle\.mjs$''','''^scripts/sealed-realms-production-g002-lane\.bundle\.mjs$''','''^scripts/sealed-realms-production-ptr-lane\.bundle\.mjs$''']
regexes = ['''^g002AdmissionMutationsEnabled$''']

[[allowlists]]
description = "Public recovery verification-key thumbprint, not private signing material"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^services/release-recovery/src/recoveryPublicKey\.ts$''','''^scripts/recovery-activation-candidate\.mjs$''','''^tests/fixtures/recoveryBindingCandidate\.ts$''','''^scripts/recovery-public-key\.mjs$''','''^scripts/sealed-realms-production-activation-lane\.bundle\.mjs$''','''^scripts/sealed-realms-production-g001-lane\.bundle\.mjs$''','''^scripts/sealed-realms-production-g002-lane\.bundle\.mjs$''','''^scripts/sealed-realms-production-ptr-lane\.bundle\.mjs$''']
regexes = ['''^jJpfIbYjQL5LxwND5zk1MUOqN1B3vOh_ydTAOoUnuR8$''']

[[allowlists]]
description = "Exact synthetic Worker version UUID in the non-deployable recovery candidate fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/fixtures/recoveryBindingCandidate\.ts$''']
regexes = ['''^123e4567-e89b-42d3-a456-426614174002$''']

[[allowlists]]
description = "One fixed expired test-key-signed recovery status JWT in the crypto fixture test"
targetRules = ["jwt"]
condition = "AND"
regexTarget = "secret"
paths = ['''^services/release-recovery/test/crypto\.test\.ts$''']
regexes = ['''^eyJhbGciOiJFUzI1NiIsInR5cCI6IndhcnBrZWVwLTAuNC4wLXJlY292ZXJ5LXN0YXR1cytqd3QiLCJraWQiOiJ3YXJwa2VlcC0wLjQuMC1yZWNvdmVyeS0yMDI2LTA5LTAzLTEifQ\.\.-KXyra7BGffHXoMvcsPr7lArwRAMOsgJ2YHidcQeEsRGnaXM2BFD9G9O-ri-OtNMVfxk20hcHfVTC1YfpaVLgg$''']

[[allowlists]]
description = "Exact cross-line match of two deliberately malformed RSA-key literals in the recovery evidence test"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^services/release-recovery/test/githubEvidence\.test\.ts$''']
regexes = ['''^-----BEGIN RSA PRIVATE KEY-----\\nAAAA\\n-----END RSA PRIVATE KEY-----\x27,\n {6}\x60-----BEGIN RSA PRIVATE KEY-----$''']

[[allowlists]]
description = "Exact public migration hashes in captured disposable SpacetimeDB plan fixtures; not authentication tokens"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/fixtures/existing-update-plans-2\.6\.1\.json$''']
regexes = ['''^0x7ef6acb8a31a3d56066794ee11705e277ef70c4fde804344f939b882d18b42af$''', '''^0x18f26b10d4fb11b55d124d5504f6aaa196d57cbf7c13be7bd55e8c87e809bc3d$''', '''^0x6385db21eec370c093aeec904c5a619d1d3edadf13b27e291d4c53f7fa0e2244$''']
