# Initial GitHub-only connectivity profile, not production job authorization.
http_port 172.30.240.2:3128
visible_hostname warpkeep-runner-egress
pid_filename none
access_log none
cache_log /dev/stderr
cache_store_log none
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
forwarded_for delete
via off
shutdown_lifetime 1 seconds
connect_timeout 10 seconds
request_timeout 30 seconds
acl tunnel method CONNECT
acl authorized_runner src 172.30.240.3/32
acl tls_port port 443
# -n rejects numeric destinations without reverse-DNS conversion.
acl github dstdomain -n github.com api.github.com .actions.githubusercontent.com
acl nonpublic dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3
acl nonpublic dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8 2001:db8::/32
http_access deny !authorized_runner
http_access deny !tunnel
http_access deny !tls_port
http_access deny !github
http_access deny nonpublic
http_access allow github
http_access deny all
