    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'ael-dev3/Warpkeep' &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.source_commit &&
      !contains(fromJSON('["preflight","activation-evidence-inspect","activation-evidence-generate"]'), inputs.operation)
    runs-on: [self-hosted, Linux, X64, warpkeep-production-admin, warpkeep-repository-exclusive]
    steps:
      - name: Refuse unwired provider operations
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          printf '%s\n' 'WARPKEEP_OPERATION_RESULT {"status":"SEALED_REALMS_LINUX_OPERATION_UNAVAILABLE"}'
          exit 1
