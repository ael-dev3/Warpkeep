            const expectedClosureDigest = readExactBinding(
              18,
              'AUTH_BRIDGE_PREPARED_DEPLOY_BOOTSTRAP_INVALID',
            );
            const expectedManifestSha256 = readExactBinding(
              19,
              'AUTH_BRIDGE_PREPARED_DEPLOY_BOOTSTRAP_INVALID',
            );
            if (
              !/^[a-f0-9]{64}$/u.test(expectedClosureDigest)
              || !/^[a-f0-9]{64}$/u.test(expectedManifestSha256)
            ) {
              fail('AUTH_BRIDGE_PREPARED_DEPLOY_BOOTSTRAP_INVALID');
            }
            closureBody = readFileSync(20);
            try { closeSync(20); } catch { /* Process is failing. */ }
            if (
              createHash('sha256').update(closureBody).digest('hex')
                !== expectedClosureDigest
            ) {
              fail('AUTH_BRIDGE_PREPARED_DEPLOY_BOOTSTRAP_DIGEST_MISMATCH');
            }
            const closureUrl = 'data:text/javascript;base64,'
              + closureBody.toString('base64');
            const closure = await import(closureUrl);
            if (
              typeof closure
                .verifyAuthBridgeNotificationPreparedDeployClosure
                !== 'function'
              || typeof closure
                .importAuthBridgeNotificationPreparedAttestedModules
                !== 'function'
            ) fail('AUTH_BRIDGE_PREPARED_DEPLOY_BOOTSTRAP_INVALID');
            const repositoryRoot = process.cwd();
            const authority =
              closure.verifyAuthBridgeNotificationPreparedDeployClosure({
                repositoryRoot,
              });
            if (authority.manifestSha256 !== expectedManifestSha256) {
              fail('AUTH_BRIDGE_PREPARED_DEPLOY_MANIFEST_AUTHORITY_MISMATCH');
            }
            const [installedToolchain, staticPolicy] =
              await closure
                .importAuthBridgeNotificationPreparedAttestedModules({
                  authority,
                  repositoryRoot,
                  memberPaths: [installedToolchainPath, staticPolicyPath],
                });
            if (
              typeof installedToolchain
                .verifyAuthBridgeNotificationPreparedInstalledToolchain
                !== 'function'
              || typeof staticPolicy
                .verifyAuthBridgeNotificationPreparedStaticPolicy
                !== 'function'
            ) fail('AUTH_BRIDGE_PREPARED_DEPLOY_PREFLIGHT_INVALID');
            const toolchainAuthority = installedToolchain
              .verifyAuthBridgeNotificationPreparedInstalledToolchain({
                repositoryRoot,
                nodeExecutable: process.execPath,
              });
            const policyAuthority =
              staticPolicy.verifyAuthBridgeNotificationPreparedStaticPolicy({
                repositoryRoot,
              });
            if (
              toolchainAuthority.sourceClosureManifestSha256
                !== expectedManifestSha256
              || policyAuthority.guardedRecoveryRequired !== true
            ) fail('AUTH_BRIDGE_PREPARED_DEPLOY_PREFLIGHT_INVALID');
            const authorityAfterPreflight =
              closure.verifyAuthBridgeNotificationPreparedDeployClosure({
                repositoryRoot,
              });
            if (
              authorityAfterPreflight.manifestSha256
                !== expectedManifestSha256
            ) {
              fail('AUTH_BRIDGE_PREPARED_DEPLOY_MANIFEST_AUTHORITY_MISMATCH');
            }
            const [entrypoint] =
              await closure
                .importAuthBridgeNotificationPreparedAttestedModules({
                  authority: authorityAfterPreflight,
                  repositoryRoot,
                  memberPaths: [entrypointPath],
                });
            if (
              typeof entrypoint.runAuthBridgeNotificationPreparedReadOnlyRecovery
                !== 'function'
            ) fail('AUTH_BRIDGE_PREPARED_DEPLOY_ENTRYPOINT_INVALID');
            const values = Object.create(null);
            for (const [name, descriptor] of bindings) {
              values[name] = readExactBinding(
                descriptor,
                'AUTH_BRIDGE_PREPARED_DEPLOY_CREDENTIALS_INVALID',
              );
            }
            if (
              values.GITHUB_TOKEN
                === values.WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN
              || values.GITHUB_TOKEN
                === values.WARPKEEP_PRODUCTION_ADMIN_TOKEN
              || values.WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN
                === values.WARPKEEP_PRODUCTION_ADMIN_TOKEN
            ) fail('AUTH_BRIDGE_PREPARED_DEPLOY_CREDENTIALS_INVALID');
            for (const [name] of bindings) process.env[name] = values[name];
            const result = await entrypoint
              .runAuthBridgeNotificationPreparedReadOnlyRecovery();
            if (result?.outcome !== 'verified-read-only-recovery') {
              fail('AUTH_BRIDGE_PREPARED_READ_ONLY_RECOVERY_INVALID');
            }
          } catch (error) {
            const code = typeof error?.code === 'string'
              && /^[A-Z0-9_]{8,128}$/u.test(error.code)
              ? error.code
              : 'AUTH_BRIDGE_PREPARED_DEPLOY_BOOTSTRAP_FAILED';
            process.stderr.write(code + '\n');
            process.exitCode = 1;
          } finally {
            if (closureBody !== undefined) closureBody.fill(0);
          }
          WARPKEEP_PROTECTED_NODE_BOOTSTRAP
          exec 18< <(printf '%s\n' "$WARPKEEP_PREPARED_SOURCE_CLOSURE_VERIFIER_SHA256")
          exec 19< <(printf '%s\n' "$WARPKEEP_PREPARED_SOURCE_CLOSURE_MANIFEST_SHA256")
          exec 20< scripts/auth-bridge-notification-prepared-deploy-closure.mjs
          exec 21< <(printf '%s\n' "$GITHUB_ACTIONS")
          exec 22< <(printf '%s\n' "$GITHUB_EVENT_NAME")
          exec 23< <(printf '%s\n' "$GITHUB_REF")
          exec 24< <(printf '%s\n' "$GITHUB_REPOSITORY")
          exec 25< <(printf '%s\n' "$GITHUB_RUN_ATTEMPT")
          exec 26< <(printf '%s\n' "$GITHUB_RUN_ID")
          exec 27< <(printf '%s\n' "$GITHUB_SHA")
          exec 28< <(printf '%s\n' "$GITHUB_TOKEN")
          exec 29< <(printf '%s\n' "$GITHUB_WORKFLOW_REF")
          exec 30< <(printf '%s\n' "$WARPKEEP_AUTH_BRIDGE_ACCOUNT_ID")
          exec 31< <(printf '%s\n' "$WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN")
          exec 32< <(printf '%s\n' "$WARPKEEP_AUTH_BRIDGE_ZONE_ID")
          exec 33< <(printf '%s\n' "$WARPKEEP_PRODUCTION_ADMIN_TOKEN")
          verify_immutable_executable_path "$node_executable"
          unset PWD
          exec -c "$node_executable" --input-type=module <&17 >/dev/null

      - name: Require a verified deployment or recovery
        if: ${{ always() }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u PS4 -u NODE_OPTIONS -u NODE_PATH -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH PATH=/usr/bin:/bin /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          WARPKEEP_OPERATION: ${{ inputs.operation }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYMENT_ATTEMPTED: ${{ steps.deploy.outputs.attempted }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          set -euo pipefail
          if [[ "$WARPKEEP_OPERATION" == 'recover-expired-authority-read-only' \
            && "$RECOVERY_OUTCOME" == 'success' ]]; then
            exit 0
          fi
          if [[ "$DEPLOYMENT_ATTEMPTED" == 'true' \
            && "$DEPLOY_OUTCOME" == 'success' ]]; then
            exit 0
          fi
          echo 'AUTH_BRIDGE_PREPARED_DEPLOY_OR_RECOVERY_UNVERIFIED' >&2
          exit 1
