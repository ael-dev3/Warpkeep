name: Prepare Admission Notification Auth Bridge

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact protected main commit to prepare
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: notification-bridge-prepared
  cancel-in-progress: false

jobs:
  notification-bridge-prepared:
    # This repository-exclusive account retains the owner-only deploy journal
    # and receipt namespace across failed jobs and runner restarts. Never move
    # this mutation onto a GitHub-hosted or ephemeral runner.
    runs-on: [self-hosted, macOS, ARM64, warpkeep-production-admin, warpkeep-repository-exclusive]
    timeout-minutes: 45
    environment:
      name: notification-bridge-prepared
    permissions:
      actions: read
      contents: read
    env:
      WARPKEEP_EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      # This protected manual phase is bridge-only. Later execution and
      # presentation gates remain inert in both source and the receipt ABI.
      WARPKEEP_BRIDGE_NOTIFICATION_DELIVERY_ENABLED: 'true'
      WARPKEEP_HERMES_EXECUTION_APPROVED: 'false'
      WARPKEEP_PAGES_PRESENTATION_ENABLED: 'false'
      WARPKEEP_PREPARED_SOURCE_CLOSURE_VERIFIER_SHA256: '81f03855f02369bf78b99838942df7ba0268dfe16a954313ce83996f404a9b04'
      WARPKEEP_PREPARED_SOURCE_CLOSURE_MANIFEST_SHA256: '02077b80179c796f8da6c48c2f61a1b5462bd5c1b70e43f19e9a68a3d025497d'
      WARPKEEP_PREPARED_INSTALLED_TOOLCHAIN_VERIFIER_SHA256: '28b262795718a55c3651cab076fb03cddecb82521dc987b3fe7ba26df3635907'
      WARPKEEP_PREPARED_INSTALLED_TOOLCHAIN_MANIFEST_SHA256: '745188c6fae1c54b56e809916be9b50393c68d59c4f62742f55e67f4ca0550dd'
    steps:
      - name: Resolve exact protected main run authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'ael-dev3/Warpkeep' \
            || "$GITHUB_EVENT_NAME" != 'workflow_dispatch' \
            || "$GITHUB_REF" != 'refs/heads/main' \
            || "$GITHUB_SHA" != "$WARPKEEP_EXPECTED_SOURCE_COMMIT" \
            || ! "$WARPKEEP_EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The requested bridge run authority was invalid.' >&2
            exit 1
          fi
          protected_main="$(
            gh api "repos/ael-dev3/Warpkeep/branches/main" \
              --jq 'select(.protected == true) | .commit.sha'
          )"
          if [[ ! "$protected_main" =~ ^[0-9a-f]{40}$ \
            || "$protected_main" != "$WARPKEEP_EXPECTED_SOURCE_COMMIT" ]]; then
            echo 'The requested bridge source is not current protected main.' >&2
            exit 1
          fi

      - name: Checkout exact protected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Re-attest detached protected checkout
        shell: bash
        run: |
          set -euo pipefail
          git_safe=(/usr/bin/git -c core.fsmonitor=false -c core.untrackedCache=false)
          actual_commit="$("${git_safe[@]}" rev-parse --verify HEAD^{commit})"
          origin_url="$("${git_safe[@]}" remote get-url origin)"
          checkout_status="$("${git_safe[@]}" status --porcelain=v1 --untracked-files=all)"
          if [[ "$actual_commit" != "$WARPKEEP_EXPECTED_SOURCE_COMMIT" \
            || "$origin_url" != 'https://github.com/ael-dev3/Warpkeep' \
            || -n "$checkout_status" ]]; then
            echo 'The protected bridge checkout was not exact and clean.' >&2
            exit 1
          fi
          if "${git_safe[@]}" symbolic-ref -q HEAD >/dev/null; then
            echo 'The protected bridge checkout was not detached.' >&2
            exit 1
          fi
          tracked_entries="$("${git_safe[@]}" ls-files -v)"
          while IFS= read -r tracked_entry; do
            if [[ "$tracked_entry" != 'H '* ]]; then
              echo 'AUTH_BRIDGE_PREPARED_HIDDEN_INDEX_STATE_INVALID' >&2
              exit 1
            fi
          done <<< "$tracked_entries"
          "${git_safe[@]}" diff-index --quiet --cached HEAD --
          "${git_safe[@]}" diff-files --quiet --
          "${git_safe[@]}" diff --no-ext-diff --no-textconv --exit-code HEAD --
          verify_bootstrap_digest() {
            local expected="$1"
            local path="$2"
            local output
            local actual
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo 'AUTH_BRIDGE_PREPARED_BOOTSTRAP_DIGEST_INVALID' >&2
              exit 1
            fi
            output="$(/usr/bin/shasum -a 256 -- "$path")"
            actual="${output%% *}"
            if [[ "$actual" != "$expected" ]]; then
              echo 'AUTH_BRIDGE_PREPARED_BOOTSTRAP_DIGEST_MISMATCH' >&2
              exit 1
            fi
          }
          verify_bootstrap_digest "$WARPKEEP_PREPARED_SOURCE_CLOSURE_VERIFIER_SHA256" \
            scripts/auth-bridge-notification-prepared-deploy-closure.mjs
          verify_bootstrap_digest "$WARPKEEP_PREPARED_SOURCE_CLOSURE_MANIFEST_SHA256" \
            scripts/auth-bridge-notification-prepared-deploy-closure-v1.json
          verify_bootstrap_digest "$WARPKEEP_PREPARED_INSTALLED_TOOLCHAIN_VERIFIER_SHA256" \
            scripts/auth-bridge-notification-prepared-installed-toolchain.mjs
          verify_bootstrap_digest "$WARPKEEP_PREPARED_INSTALLED_TOOLCHAIN_MANIFEST_SHA256" \
            scripts/auth-bridge-notification-prepared-installed-toolchain-darwin-arm64-v1.json

      - name: Setup pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0
          run_install: false

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: services/auth-bridge/pnpm-lock.yaml

      - name: Install exact auth bridge dependencies
        run: pnpm --dir services/auth-bridge install --frozen-lockfile --ignore-scripts --package-import-method=copy

      - name: Attest source and toolchain immediately before production secrets
        shell: bash
        run: |
          set -euo pipefail
          git_safe=(/usr/bin/git -c core.fsmonitor=false -c core.untrackedCache=false)
          actual_commit="$("${git_safe[@]}" rev-parse --verify HEAD^{commit})"
          checkout_status="$("${git_safe[@]}" status --porcelain=v1 --untracked-files=all)"
          if [[ "$actual_commit" != "$WARPKEEP_EXPECTED_SOURCE_COMMIT" \
            || -n "$checkout_status" ]]; then
            echo 'AUTH_BRIDGE_PREPARED_POSTINSTALL_SOURCE_INVALID' >&2
            exit 1
          fi
          tracked_entries="$("${git_safe[@]}" ls-files -v)"
          while IFS= read -r tracked_entry; do
            if [[ "$tracked_entry" != 'H '* ]]; then
              echo 'AUTH_BRIDGE_PREPARED_HIDDEN_INDEX_STATE_INVALID' >&2
              exit 1
            fi
          done <<< "$tracked_entries"
          "${git_safe[@]}" diff-index --quiet --cached HEAD --
          "${git_safe[@]}" diff-files --quiet --
          "${git_safe[@]}" diff --no-ext-diff --no-textconv --exit-code HEAD --
          verify_bootstrap_digest() {
            local expected="$1"
            local path="$2"
            local output
            local actual
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo 'AUTH_BRIDGE_PREPARED_BOOTSTRAP_DIGEST_INVALID' >&2
              exit 1
            fi
            output="$(/usr/bin/shasum -a 256 -- "$path")"
            actual="${output%% *}"
            if [[ "$actual" != "$expected" ]]; then
              echo 'AUTH_BRIDGE_PREPARED_BOOTSTRAP_DIGEST_MISMATCH' >&2
              exit 1
            fi
          }
          verify_bootstrap_digest "$WARPKEEP_PREPARED_SOURCE_CLOSURE_VERIFIER_SHA256" \
            scripts/auth-bridge-notification-prepared-deploy-closure.mjs
          verify_bootstrap_digest "$WARPKEEP_PREPARED_SOURCE_CLOSURE_MANIFEST_SHA256" \
            scripts/auth-bridge-notification-prepared-deploy-closure-v1.json
          verify_bootstrap_digest "$WARPKEEP_PREPARED_INSTALLED_TOOLCHAIN_VERIFIER_SHA256" \
            scripts/auth-bridge-notification-prepared-installed-toolchain.mjs
          verify_bootstrap_digest "$WARPKEEP_PREPARED_INSTALLED_TOOLCHAIN_MANIFEST_SHA256" \
            scripts/auth-bridge-notification-prepared-installed-toolchain-darwin-arm64-v1.json
          node scripts/auth-bridge-notification-prepared-deploy-closure.mjs
          node scripts/auth-bridge-notification-prepared-installed-toolchain.mjs
          node scripts/auth-bridge-notification-prepared-deploy-closure.mjs

      - name: Prove guarded bridge-only release policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-auth-bridge-notification-prepared-policy.mjs
          if [[ "$WARPKEEP_BRIDGE_NOTIFICATION_DELIVERY_ENABLED" != 'true' \
            || "$WARPKEEP_HERMES_EXECUTION_APPROVED" != 'false' \
            || "$WARPKEEP_PAGES_PRESENTATION_ENABLED" != 'false' ]]; then
            echo 'The bridge-only release gates were not exact.' >&2
            exit 1
          fi
          variable="$(
            gh api --paginate "repos/ael-dev3/Warpkeep/actions/variables" \
              --jq '.variables[] | select(.name == "WARPKEEP_ADMISSION_NOTIFICATIONS_ENABLED") | .value'
          )"
          pages_value="${variable:-false}"
          if [[ "$pages_value" != 'false' ]]; then
            echo 'Pages notification presentation is not inert.' >&2
            exit 1
          fi

      - name: Run guarded prepared bridge deployment
        id: deploy
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WARPKEEP_AUTH_BRIDGE_ACCOUNT_ID: ${{ secrets.WARPKEEP_AUTH_BRIDGE_ACCOUNT_ID }}
          WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN: ${{ secrets.WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN }}
          WARPKEEP_AUTH_BRIDGE_ZONE_ID: ${{ secrets.WARPKEEP_AUTH_BRIDGE_ZONE_ID }}
          WARPKEEP_PRODUCTION_ADMIN_TOKEN: ${{ secrets.WARPKEEP_PRODUCTION_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GITHUB_TOKEN" \
            || -z "$WARPKEEP_AUTH_BRIDGE_ACCOUNT_ID" \
            || -z "$WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN" \
            || -z "$WARPKEEP_AUTH_BRIDGE_ZONE_ID" \
            || -z "$WARPKEEP_PRODUCTION_ADMIN_TOKEN" \
            || "$GITHUB_TOKEN" == "$WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN" \
            || "$GITHUB_TOKEN" == "$WARPKEEP_PRODUCTION_ADMIN_TOKEN" \
            || "$WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN" == "$WARPKEEP_PRODUCTION_ADMIN_TOKEN" ]]; then
            echo 'AUTH_BRIDGE_PREPARED_DEPLOY_CREDENTIALS_INVALID' >&2
            exit 1
          fi
          printf '%s\n' 'attempted=true' >> "$GITHUB_OUTPUT"
          node scripts/auth-bridge-notification-prepared-deploy.mjs >/dev/null

      - name: Recover and re-attest a failed deployment attempt
        id: recovery
        if: ${{ always() && steps.deploy.outputs.attempted == 'true' && steps.deploy.outcome != 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WARPKEEP_AUTH_BRIDGE_ACCOUNT_ID: ${{ secrets.WARPKEEP_AUTH_BRIDGE_ACCOUNT_ID }}
          WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN: ${{ secrets.WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN }}
          WARPKEEP_AUTH_BRIDGE_ZONE_ID: ${{ secrets.WARPKEEP_AUTH_BRIDGE_ZONE_ID }}
          WARPKEEP_PRODUCTION_ADMIN_TOKEN: ${{ secrets.WARPKEEP_PRODUCTION_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GITHUB_TOKEN" \
            || -z "$WARPKEEP_AUTH_BRIDGE_ACCOUNT_ID" \
            || -z "$WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN" \
            || -z "$WARPKEEP_AUTH_BRIDGE_ZONE_ID" \
            || -z "$WARPKEEP_PRODUCTION_ADMIN_TOKEN" \
            || "$GITHUB_TOKEN" == "$WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN" \
            || "$GITHUB_TOKEN" == "$WARPKEEP_PRODUCTION_ADMIN_TOKEN" \
            || "$WARPKEEP_AUTH_BRIDGE_CLOUDFLARE_API_TOKEN" == "$WARPKEEP_PRODUCTION_ADMIN_TOKEN" ]]; then
            echo 'AUTH_BRIDGE_PREPARED_DEPLOY_CREDENTIALS_INVALID' >&2
            exit 1
          fi
          node scripts/auth-bridge-notification-prepared-deploy.mjs >/dev/null

      - name: Require a verified deployment or recovery
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYMENT_ATTEMPTED: ${{ steps.deploy.outputs.attempted }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_ATTEMPTED" == 'true' \
            && ("$DEPLOY_OUTCOME" == 'success' || "$RECOVERY_OUTCOME" == 'success') ]]; then
            exit 0
          fi
          echo 'AUTH_BRIDGE_PREPARED_DEPLOY_OR_RECOVERY_UNVERIFIED' >&2
          exit 1
