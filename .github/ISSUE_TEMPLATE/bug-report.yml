name: Bug report
description: Help improve gameplay, visuals, reliability, or the contributor experience.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Tell us what interrupted the experience and what you expected. Note the realm and build so we can distinguish the running Alpha from 0.4 development. Use public behavior or a synthetic/local reproduction.

        **Do not include or attach tokens, proofs, QR payloads, wallet or account identifiers, private logs, personal data, or credentialed URLs.** For a security-sensitive problem, stop and follow [SECURITY.md](https://github.com/ael-dev3/Warpkeep/security/policy).
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      description: Where did the problem occur?
      options:
        - Live Alpha at warpkeep.com
        - Local development checkout
        - Owner PTR (public or synthetic details only)
        - Documentation or repository workflow
        - Other public Warpkeep surface
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or public build
      description: Use the visible Alpha version, public release identifier, or commit SHA. Do not paste a credentialed URL.
      placeholder: Visible version and build, or the development commit
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the visible problem and its impact using public or synthetic context only.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest safe sequence that reproduces the problem. Never reproduce against another person or include private evidence.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What clear, player-facing result did you expect?
      render: text
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Often
        - Once so far
        - Unknown
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and entry route
      description: Browser or Farcaster Mini App, device type, and graphics setting if relevant. Omit account identifiers and private details.
      placeholder: Mobile browser · reduced graphics · after returning from the background
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety check
      options:
        - label: I removed tokens, proofs, QR payloads, wallet or account identifiers, private logs, personal data, and credentialed URLs; this report contains only public or synthetic information.
          required: true
        - label: This is not a security vulnerability. I will follow SECURITY.md instead for security-sensitive behavior.
          required: true
