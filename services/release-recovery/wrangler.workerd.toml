name = "warpkeep-release-recovery-ledger-test"
main = "test-workerd/worker.ts"
compatibility_date = "2026-07-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[services]]
binding = "RECOVERY_GATEWAY_TEST_SIGNER"
service = "warpkeep-release-recovery-ledger-test"
entrypoint = "RecoveryGatewayTestSigner"

[[durable_objects.bindings]]
name = "RECOVERY_LEDGER"
class_name = "ReleaseRecoveryAuthorizationLedger"

[[durable_objects.bindings]]
name = "RECOVERY_LEDGER_V2"
class_name = "ReleaseRecoveryAuthorizationLedgerV2"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReleaseRecoveryAuthorizationLedger"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ReleaseRecoveryAuthorizationLedgerV2"]
