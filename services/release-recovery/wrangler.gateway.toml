name = "warpkeep-release-recovery-gateway"
main = "src/index-gateway.ts"
compatibility_date = "2026-07-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "release-auth.warpkeep.com"
custom_domain = true

[[services]]
binding = "RECOVERY_SIGNER"
service = "warpkeep-release-recovery-signer"
entrypoint = "ReleaseRecoverySignerEntrypoint"

[observability]
enabled = false
