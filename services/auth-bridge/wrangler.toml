# This file prepares the stable public bridge contract but intentionally contains
# no key material, RPC endpoint, admin secret, or resolver credential. Configure
# those as managed Worker secrets before deploying; the bridge fails closed until
# every required value is present.
name = "warpkeep-auth-bridge"
main = "src/index.ts"
compatibility_date = "2026-07-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
ENVIRONMENT = "production"
ISSUER = "https://auth.warpkeep.com"
ALLOWED_ORIGINS = "https://warpkeep.com"
FARCASTER_DOMAIN = "warpkeep.com"
FARCASTER_SIWE_URI = "https://warpkeep.com/"
OIDC_AUDIENCE = "warpkeep-spacetimedb"
OIDC_KEY_ID = "warpkeep-alpha-2026-07-01"
SPACETIMEDB_URI = "https://maincloud.spacetimedb.com"
SPACETIMEDB_DATABASE = "c2001f161d44e50c0a75356d79a4d10fa4a9d77ea4eddd56cda7ac6af50b570e"
PUBLIC_AUTH_ENABLED = "false"
# Temporary compatibility phase only: deploy this bridge before the matching
# frontend, then change the value to "true" after legacy browser caches drain.
# The protected configuration attestation makes the final state observable.
ACCESS_EXPECTED_FID_REQUIRED = "false"
QA_OBSERVER_ENABLED = "false"
# Owner-only Public Test Realm. Configure its exact immutable database identity,
# dedicated audience, and managed PLAYER_CANARY_OWNER_FID before enabling.
PTR_ENABLED = "false"
# Independent rollout gate. The public manifest must not advertise its webhook
# until the matching Worker deployment has this enabled and attested.
APPROVAL_NOTIFICATIONS_ENABLED = "false"
MINIAPP_NOTIFICATION_HUB_URLS = "https://rho.farcaster.xyz:3381/,https://hub.pinata.cloud/"
MINIAPP_NOTIFICATION_CLIENTS = "9152=https://api.farcaster.xyz/v1/frame-notifications"

[[routes]]
pattern = "auth.warpkeep.com"
custom_domain = true

[[durable_objects.bindings]]
name = "CHALLENGE_REPLAY_GUARD"
class_name = "ChallengeReplayGuard"

[[durable_objects.bindings]]
name = "QA_CHALLENGE_REPLAY_GUARD"
class_name = "QaChallengeReplayGuard"

[[durable_objects.bindings]]
name = "AUTH_RATE_LIMITER"
class_name = "AuthRateLimiter"

[[durable_objects.bindings]]
name = "SESSION_FAMILIES"
class_name = "SessionFamily"

[[durable_objects.bindings]]
name = "ADMISSION_NOTIFICATIONS"
class_name = "AdmissionNotification"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChallengeReplayGuard"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthRateLimiter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SessionFamily"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["QaChallengeReplayGuard"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["AdmissionNotification"]
